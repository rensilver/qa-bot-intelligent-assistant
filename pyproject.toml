[project]
name = "qa-bot-intelligent-assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Renato Silveira", email = "ren.oliv87@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "gradio>=6.26.0",
    "huggingface-hub>=1.29.0",
    "langchain>=1.3.18",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "pydantic>=2.13.5",
    "pypdf>=6.16.2",
    "starlette>=1.6.0",
]

[project.scripts]
qa-bot-intelligent-assistant = "qa_bot_intelligent_assistant.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
